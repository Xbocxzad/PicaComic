name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Apply patch
        run: python3 patch.py

      - name: Signing setup
        run: |
          if [ -f keystore.b64 ]; then
            if base64 -d keystore.b64 > android/app/release.jks 2>/dev/null && [ -s android/app/release.jks ]; then
              echo "using committed keystore (base64)"
            else
              cp keystore.b64 android/app/release.jks
              echo "using committed keystore (binary)"
            fi
          else
            keytool -genkeypair -v -keystore android/app/release.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias release -storepass picabuild -keypass picabuild \
              -dname "CN=Pica, OU=Dev, O=Dev, L=Dev, ST=Dev, C=CN"
            echo "generated new keystore"
          fi
          printf 'storeFile=release.jks\nstorePassword=picabuild\nkeyAlias=release\nkeyPassword=picabuild\n' > android/key.properties
          base64 -w0 android/app/release.jks > /tmp/k.b64
          echo "KEYSTORE_B64_LEN=$(wc -c < /tmp/k.b64)"
          flutter --version

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: android/app/release.jks
          retention-days: 30

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Stage main apk
        run: |
          mkdir -p build/coexist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/coexist/pica-main-arm64.apk
          ls -lh build/coexist

      - name: Apply coexist patch
        run: python3 patch2.py

      - name: Build co-exist APK
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Stage coexist apk
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/coexist/pica-lx-arm64.apk
          find build/app/outputs -name '*.apk' -exec ls -lh {} \;
          ls -lh build/coexist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pica-apks
          path: build/coexist/*.apk
          if-no-files-found: warn
          retention-days: 14