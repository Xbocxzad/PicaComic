name: build-apk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Apply patch
        run: python3 patch.py

      - name: Signing setup
        run: |
          keytool -genkeypair -v -keystore android/release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias release -storepass picabuild -keypass picabuild \
            -dname "CN=Pica, OU=Dev, O=Dev, L=Dev, ST=Dev, C=CN"
          printf 'storeFile=release.jks\nstorePassword=picabuild\nkeyAlias=release\nkeyPassword=picabuild\n' > android/key.properties
          flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Show outputs
        if: always()
        run: find build/app/outputs -name '*.apk' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pica-patched
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 14